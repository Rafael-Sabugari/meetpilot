[workspace]
resolver = "2"
members = ["crates/audio-capture", "crates/realtime-client", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
