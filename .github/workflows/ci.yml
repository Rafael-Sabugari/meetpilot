name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: "Also build the Windows app"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions minutes are limited on a private repo (macOS counts 10x, Windows 2x), so each
# job runs only when its part of the code changed, and Windows only when asked.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.f.outputs.frontend }}
      backend: ${{ steps.f.outputs.backend }}
      native: ${{ steps.f.outputs.native }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            frontend:
              - 'apps/**'
              - 'packages/**'
              - 'package*.json'
            backend:
              - 'backend/**'
            native:
              - 'apps/**'
              - 'crates/**'
              - 'packages/**'
              - 'Cargo.*'
              - 'package*.json'
              - '.github/workflows/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @meetpilot/desktop

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: meetpilot, POSTGRES_PASSWORD: ci, POSTGRES_DB: meetpilot }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meetpilot" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app tests scripts evals
      - run: uv run pytest -W error
      - name: Migrations up/down/up on PostgreSQL
        env:
          MEETPILOT_DATABASE_URL: postgresql+asyncpg://meetpilot:ci@localhost:5432/meetpilot
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  rust-linux:
    needs: changes
    if: needs.changes.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System deps (Tauri + ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build -w @meetpilot/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p meetpilot-audio --no-default-features

  # Native compile + tests on the target OSes. CI runners have no real meeting audio,
  # so this proves compilation, linking, unit/session tests and capability detection;
  # real capture is validated manually with mp-audio-probe (docs/AUDIO_CAPTURE.md).
  desktop-native:
    needs: changes
    if: needs.changes.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows && '["macos-latest","windows-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build -w @meetpilot/desktop
      # macOS: Apple's on-device transcription helper (needs the newest Xcode for the
      # macOS 26 SDK; with an older one a stub is built and the app falls back to Whisper).
      - name: Build Apple speech helper (macOS)
        if: runner.os == 'macOS'
        run: |
          NEWEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          apps/desktop/src-tauri/speech/build.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p meetpilot-audio --bin mp-audio-probe --release
      - name: Capability detection smoke test
        run: cargo run -q -p meetpilot-audio --bin mp-audio-probe --release -- capabilities
      - name: Device enumeration (informational)
        continue-on-error: true
        run: cargo run -q -p meetpilot-audio --bin mp-audio-probe --release -- devices
      # macOS: free transcription with Whisper on the Apple GPU (Metal) is built in.
      - name: Clippy with local Whisper (macOS)
        if: runner.os == 'macOS'
        run: cargo clippy -p meetpilot-desktop --features local-whisper --all-targets -- -D warnings
      - name: Real Whisper inference test (macOS, tiny model + whisper.cpp sample)
        if: runner.os == 'macOS'
        run: |
          curl -sSfL -o /tmp/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          echo "bd577a113a864445d4c299885e0cb97d4ba92b5f  /tmp/ggml-tiny.bin" | shasum -a 1 -c -
          curl -sSfL -o /tmp/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          MEETPILOT_REQUIRE_REAL_MODEL=1 MEETPILOT_TEST_WHISPER_MODEL=/tmp/ggml-tiny.bin MEETPILOT_TEST_WAV=/tmp/jfk.wav \
            cargo test -p meetpilot-local-stt --features metal --test real_model -- --nocapture
      - name: Bundle desktop app (unsigned)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx tauri build --ci --no-sign --features local-whisper
          else
            npx tauri build --ci --no-sign
          fi
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v5
        with:
          name: meetpilot-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
          if-no-files-found: warn
