[project]
name = "meetpilot-backend"
version = "0.1.0"
description = "MeetPilot SaaS backend (modular monolith). Never joins meetings; receives audio only from the user's own desktop app."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.22.1",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "argon2-cffi>=25.1.0",
  "pyjwt>=2.15.1",
  "websockets>=17.4",
  "email-validator>=2",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx2>=2.16.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# Prompt text is kept readable as prose.
"app/ai/copilot.py" = ["E501"]
"app/brain/ai.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
