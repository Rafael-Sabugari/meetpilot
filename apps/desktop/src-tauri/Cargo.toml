[package]
name = "meetpilot-desktop"
description = "MeetPilot desktop app: private, local meeting copilot (never joins meetings)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "meetpilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Free transcription with Whisper on this computer (Apple GPU). Enabled for macOS builds:
# `tauri build --features local-whisper`. Needs CMake and a C++ compiler.
local-whisper = ["meetpilot-local-stt/metal"]

[dependencies]
meetpilot-local-stt = { path = "../../../crates/local-stt" }
meetpilot-audio = { path = "../../../crates/audio-capture" }
meetpilot-realtime = { path = "../../../crates/realtime-client" }
tokio = { version = "1", features = ["sync", "time"] }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger = "0.11"

# Remember the sign-in between launches: refresh token in the OS keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
